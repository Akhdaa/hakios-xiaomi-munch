# devices/munch/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device munch
	title       POCO F4
	vendor      Xiaomi
	soc         sm8250
	defconfig   munch_defconfig
	firmware    pull-firmware.sh
	maintainer  the munch port (README.md)
	status      display     partial   UEFI's framebuffer at 60 Hz (1080 x 2400) drawn by the window server, the camera's hole kept black (fb_hole=23); a tear line while things move fast (a panel in command mode: fb_beam not yet)
	status      cpu         works     all 8 cores; each group's clock follows its load (cpugov, schedutil-like, every 20 ms) up to small 1804 MHz, big 2419, the prime 2745.6 (cpufreq_prime_mhz=), 2361.6 while hot; cpugov=0: always the top (cpus=8 bootcpu=7 cpufreq=1)
	status      thermal     partial   25 of 25 sensors of kona-thermal read (thermal=1); the prime core slowed from 90 degrees (thermal_slow=); the slowing and the stop (thermal_stop=105) not yet seen
	status      touch       works     FocalTech FT3658U on SPI at 6 MHz, polled every 1 ms, 10 fingers (touchscreen=1, devices/munch/drivers/input); 8 strokes, the lift 11 ms after the last move
	status      buttons     works     the PM8150's power and volume keys, read every 16 ms (with touchscreen=1): 5 presses of each seen, 0 failed reads
	status      gpu         partial   Adreno 650 (chip 0x06050002) woken through all 22 steps (adreno=22, fw-gpu/); Mesa and the window server draw with it, surfaces shared (gpu_push_ms=0)
	status      audio       partial   Darwin plays through both TFA9874 speakers (adsp=1 sound=4, fw-audio/); AAC-LC A2DP plays smoothly on the 460800 baud RAM test; microphone support remains open
	status      battery     partial   the bq27z561 fuel gauge read every 10 s (battery=1): level, voltage, current, temperature, cycles; the PM8150B's charger state read; charging under this kernel is not done
	status      wifi        partial   QCA6390 on PCIe 0: MHI, its firmware in mission mode, ath11k up; joins a network from Settings, beside sound and the GPU (wifi=1, fw-wifi/); the card off at the end
	status      haptic      works     Awinic AW86927 on QUP 2's serial engine 15: its configuration and Android's 11 waveforms loaded, one played and felt (haptic=4; haptic=5 for Darwin, fw-haptic/)
	status      torch       works     flashlight toggles from Control Center on the phone
	status      bluetooth   partial   QCA6390 on QUP0 SE6 (munch_bt=4, fw-bluetooth/); Settings discovers and connects Classic earbuds and AAC-LC audio plays smoothly; CoreBluetooth discovery and the Control Center tile remain open
