# devices/munch/device.conf: what this device repository is (docs/porting/repositories.md has every word).
#
# A status is what was seen on the phone (POCO F4, munch) in RAM runs started with fastboot boot, up to 2026-11-19.
# `works` only for what was seen working on the phone; what is written and not seen, or seen in part, is `partial`
# with what is missing; what does not work is `missing`. devices/munch/README.md has the details for each line.

device munch
	title       POCO F4
	vendor      Xiaomi
	soc         sm8250
	defconfig   munch_defconfig
	firmware    pull-firmware.sh
	maintainer  the munch port (README.md)
	status      display     works     1080 x 2400 at 60 Hz through UEFI's framebuffer, the camera's hole kept black (fb_hole=23); physical brightness from Settings and Control Center (panel=2 fb_backlight=1); the panel sleeps with the screen off and Auto-Lock follows the Settings timeout; a tear line while things move fast (command-mode panel)
	status      touch       works     FocalTech FT3658U on SPI at 6 MHz, polled every 1 ms, 10 fingers (touchscreen=1, devices/munch/drivers/input)
	status      buttons     works     the PM8150's power and volume keys, read every 16 ms (with touchscreen=1)
	status      cpu         works     all 8 cores; each group's clock follows its load (cpugov, schedutil-like with the device tree's tables) up to small 1804, big 2419, prime 2745.6 MHz, lower caps with the screen off (cpus=8 bootcpu=7 cpufreq=1); no deep sleep: idle cores wait in WFI, no power collapse or system suspend
	status      gpu         partial   Adreno 650 through Mesa (OpenGL ES), the default; the clock follows the load between 305 and 670 MHz (adreno=22 gpu_dcvs, fw-gpu/); Metal partial: metal=1 draws the desktop through hakios-metal, still a bit choppy, one Reachability area drawn wrong
	status      storage     missing   the system lives in RAM (uploaded by the loader); nothing is read from or written to the phone's UFS by design
	status      audio       partial   both TFA9874 speakers through the audio DSP (adsp=1 sound=4, fw-audio/); the microphone driver is built but switching it on breaks touch
	status      battery     works     the bq27z561 fuel gauge read every 10 s (battery=1): level, voltage, current, temperature in the status bar; charging with munch_charge=1 (the PM8150B charger watchdog petted, input 1500 mA, battery 1800 mA on a wall charger): 55 to 58 % in about 5 minutes
	status      haptic      works     Awinic AW86927 on QUP 2 SE 15 with Android's waveforms (haptic=5, fw-haptic/)
	status      camera      partial   OV64B40 wide and IMX596 front preview in Camera.app (Titan 480, CONFIG_HAKIOS_CAMERA); the OV8856 ultra-wide is not started
	status      torch       works     the flashlight from Control Center, with its levels (munch_torch=3)
	status      wifi        works     QCA6390 on PCIe 0 with the phone's own firmware (wifi=1, fw-wifi/); joins a network from Settings
	status      bluetooth   partial   QCA6390 on QUP0 SE6 (munch_bt=4, fw-bluetooth/); Classic earbuds connect from Settings and play A2DP (AAC-LC); the Control Center tile and CoreBluetooth discovery open
	status      cellular    missing   the Snapdragon X55 is found on PCIe 2 and torn down cleanly, but its boot ROM refuses the boot loader over BHI (0xef0e0003); no Cellular page
	status      network     partial   Wi-Fi as above, with DHCP and Safari pages; no mobile data
	status      thermal     partial   25 of 25 sensors of kona-thermal read (thermal=1); the prime core and the GPU slowed when hot; the stop (thermal_stop=105) not yet seen
	status      usb         partial   the loader's USB channel (fastboot, xl, the system image upload, about 100 s) and the kernel's control channel; no USB device class for iOS
	status      sensors     missing   no accelerometer, proximity or light through the SLPI; no auto-rotate; no GNSS
