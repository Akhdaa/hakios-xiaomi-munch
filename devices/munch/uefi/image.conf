# The POCO F4's UEFI in its boot image (mkxnuimg.py): where the boot shim puts the firmware volume and the payload.
# From the Mu-Silicium platform in uefi/files/Platforms/Xiaomi/munchPkg (aliothPkg's memory map: the same SoC).
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # free RAM 0xD0000000..0xFFC00000
PRODUCT=munch                   # `fastboot getvar product`: xl boots this UEFI on no other phone
